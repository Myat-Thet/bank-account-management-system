<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE - Bank Management">
        Bank Management
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #333;
        }

        /* =========================
           NAVBAR
           ========================= */

        nav {
            background: #1e3a5f;
            padding: 0 40px;
            height: 65px;

            display: flex;
            align-items: center;
            gap: 10px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .brand {
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;

            margin-right: 30px;
        }

        nav a {
            color: #e8eef5;
            text-decoration: none;

            padding: 10px 14px;
            border-radius: 6px;

            font-size: 14px;

            transition: 0.2s;
        }

        nav a:hover {
            background: #2f557f;
            color: white;
        }

        /* =========================
           MAIN CONTAINER
           ========================= */

        .container {
            width: 90%;
            max-width: 1200px;

            margin: 35px auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           HEADINGS
           ========================= */

        h1 {
            margin-top: 0;
            margin-bottom: 25px;

            color: #1e3a5f;
        }

        h2 {
            color: #1e3a5f;
        }

        /* =========================
           TABLE
           ========================= */

        table {
            width: 100%;
            border-collapse: collapse;

            margin-top: 20px;
        }

        table,
        th,
        td {
            border: 1px solid #e1e5eb;
        }

        th,
        td {
            padding: 13px 15px;
            text-align: left;
        }

        th {
            background: #1e3a5f;
            color: white;

            font-weight: 600;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        tr:hover {
            background: #eef4fa;
        }

        /* =========================
           FORM
           ========================= */

        form {
            margin-top: 15px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: 600;
            color: #444;
        }

        input,
        select {
            width: 100%;

            padding: 11px 12px;

            margin-bottom: 15px;

            border: 1px solid #ccd3dc;
            border-radius: 6px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #1e3a5f;

            box-shadow: 0 0 0 2px rgba(30, 58, 95, 0.1);
        }

        /* =========================
           BUTTON
           ========================= */

        button,
        .btn {
            display: inline-block;

            padding: 9px 16px;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }

        button {
            background: #1e3a5f;
            color: white;
        }

        button:hover {
            background: #142a45;
        }

        .btn {
            background: #1e3a5f;
            color: white;
        }

        .btn:hover {
            background: #142a45;
        }

        /* =========================
           ACTION BUTTONS
           ========================= */

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-view {
            background: #64748b;
            color: white;
        }

        .btn-view:hover {
            background: #475569;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #b02a37;
        }

        .btn-success {
            background: #198754;
            color: white;
        }

        .btn-success:hover {
            background: #157347;
        }

        /* =========================
           ACTION AREA
           ========================= */

        .actions {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }

        /* =========================
           CARD
           ========================= */

        .card {
            background: white;

            border: 1px solid #e1e5eb;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 20px;
        }

        /* =========================
           MESSAGE
           ========================= */

        .message {
            padding: 12px 15px;

            border-radius: 6px;

            margin-bottom: 20px;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 768px) {

            nav {
                height: auto;

                padding: 15px;

                flex-wrap: wrap;
            }

            .brand {
                width: 100%;

                margin-bottom: 5px;
            }

            .container {
                width: 95%;

                padding: 20px;
            }

            table {
                display: block;

                overflow-x: auto;
            }
        }

    </style>

</head>


<body>

    <!-- =========================
         NAVBAR
         ========================= -->

    <nav>

        <a class="brand"
           th:href="@{/}">
            🏦 Bank Management
        </a>

        <a th:href="@{/customer/view}">
            Customers
        </a>

        <a th:href="@{/account/view}">
            Accounts
        </a>

        <a th:href="@{/customer}">
            Add Customer
        </a>

        <a th:href="@{/account}">
            Add Account
        </a>

    </nav>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <div class="container">

        <div layout:fragment="content">

            Content Here

        </div>

    </div>

</body>

</html>
