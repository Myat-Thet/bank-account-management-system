<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/master}">

<head>
<title>Account Form</title>

<style>

/* =========================
           ACCOUNT FORM
           ========================= */
.form-wrapper {
	max-width: 600px;
	margin: 10px auto;
}

.form-header {
	text-align: center;
	margin-bottom: 30px;
}

.form-header h1 {
	margin-bottom: 8px;
	color: #1e3a5f;
	font-size: 28px;
}

.form-header p {
	margin: 0;
	color: #777;
	font-size: 14px;
}

.account-form {
	background: #ffffff;
	border: 1px solid #e1e5eb;
	border-radius: 12px;
	padding: 30px;
	box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
}

.form-group {
	margin-bottom: 22px;
}

.form-group label {
	display: block;
	margin-bottom: 8px;
	font-size: 14px;
	font-weight: 600;
	color: #333;
}

.form-group input {
	width: 100%;
	padding: 12px 14px;
	border: 1px solid #ccd3dc;
	border-radius: 7px;
	font-size: 15px;
	outline: none;
	transition: 0.2s;
}

.form-group input:focus {
	border-color: #1e3a5f;
	box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
}

.form-group input::placeholder {
	color: #aaa;
}

.form-actions {
	display: flex;
	gap: 10px;
	margin-top: 28px;
}

.btn-submit {
	flex: 1;
	padding: 12px;
	background: #1e3a5f;
	color: white;
	border: none;
	border-radius: 7px;
	font-size: 15px;
	font-weight: 600;
	cursor: pointer;
	transition: 0.2s;
}

.btn-submit:hover {
	background: #142a45;
}

.btn-cancel {
	padding: 12px 20px;
	background: #f1f3f5;
	color: #555;
	border: 1px solid #ddd;
	border-radius: 7px;
	text-decoration: none;
	font-size: 15px;
	display: flex;
	align-items: center;
	justify-content: center;
	transition: 0.2s;
}

.btn-cancel:hover {
	background: #e2e6ea;
	color: #333;
}

/* =========================
           RESPONSIVE
           ========================= */
@media ( max-width : 600px) {
	.form-wrapper {
		width: 100%;
	}
	.account-form {
		padding: 20px;
	}
	.form-actions {
		flex-direction: column;
	}
	.btn-cancel {
		padding: 12px;
	}
}
</style>
</head>


<body>

	<div layout:fragment="content">

		<div class="form-wrapper">

			<div class="form-header">

				<h1>Account Form</h1>

				<p>Create a new bank account or update an existing account</p>

			</div>


			<form class="account-form"
				th:action="${account.id == null}
                    ? @{/account/save}
                    : @{/account/update/{id}(id=${account.id})}"
				th:object="${account}" method="post">


				<!-- Account Number -->

				<div class="form-group">

					<label for="accountNumber"> Account Number </label> <input
						type="text" id="accountNumber" th:field="*{accountNumber}"
						placeholder="Enter account number" required>

				</div>


				<!-- Balance -->

				<div class="form-group">

					<label for="balance"> Balance </label> <input type="number"
						id="balance" th:field="*{balance}" placeholder="Enter balance"
						min="0" step="0.01" required>

				</div>


				<!-- Buttons -->

				<div class="form-actions">

					<button type="submit" class="btn-submit">

						<span
							th:text="${account.id == null}
                            ? 'Save Account'
                            : 'Update Account'">
						</span>

					</button>


					<a th:href="@{/account/view}" class="btn-cancel"> Cancel </a>

				</div>

			</form>

		</div>

	</div>

</body>

</html>
